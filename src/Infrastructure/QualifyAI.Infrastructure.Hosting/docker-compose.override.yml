services:
  platform-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Consul__Address: http://consul:8500
      Seq__Url: http://seq:5341
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=QualifyAI_Business;User Id=sa;Password=${SQL_SA_PASSWORD:-QualifyAI_SQL_ChangeMe123!};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      ConnectionStrings__AutomationDb: "Server=sqlserver,1433;Database=QualifyAI_AutomationDb;User Id=sa;Password=${SQL_SA_PASSWORD:-QualifyAI_SQL_ChangeMe123!};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      ConnectionStrings__NotificationsDb: "Server=sqlserver,1433;Database=QualifyAI_NotificationsDb;User Id=sa;Password=${SQL_SA_PASSWORD:-QualifyAI_SQL_ChangeMe123!};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      ConnectionStrings__KnowledgeDb: "Server=sqlserver,1433;Database=QualifyAI_KnowledgeDb;User Id=sa;Password=${SQL_SA_PASSWORD:-QualifyAI_SQL_ChangeMe123!};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      ConnectionStrings__AIOrchestrationDb: "Server=sqlserver,1433;Database=QualifyAI_AIOrchestrationDb;User Id=sa;Password=${SQL_SA_PASSWORD:-QualifyAI_SQL_ChangeMe123!};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      ConnectionStrings__IntegrationsDb: "Server=sqlserver,1433;Database=QualifyAI_IntegrationsDb;User Id=sa;Password=${SQL_SA_PASSWORD:-QualifyAI_SQL_ChangeMe123!};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      Identity__Audience: qualifyai-api
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:-QualifyAI_Redis_ChangeMe!},abortConnect=false"
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      Email__Provider: ${EMAIL_PROVIDER:-disabled}
      Email__DailySendLimit: ${OUTREACH_DAILY_SEND_LIMIT:-10}
      Email__Brevo__ApiKey: ${BREVO_API_KEY:-}
      Email__Brevo__WebhookToken: ${BREVO_WEBHOOK_TOKEN:-}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__UseTls: ${SMTP_USE_TLS:-true}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__SendGrid__ApiKey: ${SENDGRID_API_KEY:-}
    ports: ["8080:8080"]

  identity-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Consul__Address: http://consul:8500
      Seq__Url: http://seq:5341
      ConnectionStrings__IdentityDb: "Server=sqlserver,1433;Database=QualifyAI_IdentityDb;User Id=sa;Password=${SQL_SA_PASSWORD:-QualifyAI_SQL_ChangeMe123!};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      Identity__Audience: qualifyai-api
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:-QualifyAI_Redis_ChangeMe!},abortConnect=false"
      IdentityBootstrap__Admin__Password: ${DEMO_ADMIN_PASSWORD:-Admin123!ChangeMe}
    ports: ["8081:8080"]
