name: qualifyai-app

services:
  business-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        PROJECT: src/Business/QualifyAI.Api/QualifyAI.Api.csproj
        DLL: QualifyAI.Api.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SERVICE_NAME: business-api
      SERVICE_ADDRESS: business-api
      SERVICE_PORT: "8080"
      CONSUL_HTTP_ADDR: http://consul:8500
      SEQ_URL: http://seq:5341
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=QualifyAI_Business;User Id=sa;Password=${SQL_SA_PASSWORD:-QualifyAI_SQL_ChangeMe123!};TrustServerCertificate=True;Encrypt=False"
      Identity__Authority: http://identity-api:8080
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:-QualifyAI_Redis_ChangeMe!}"
      RevenueAutomation__Enabled: "true"
      RevenueAutomation__IntervalSeconds: "300"
    ports:
      - "8080:8080"
    networks: [qualifyai-infra]
    restart: unless-stopped

  identity-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        PROJECT: src/Services/Identity/QualifyAI.Identity.Api/QualifyAI.Identity.Api.csproj
        DLL: QualifyAI.Identity.Api.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SERVICE_NAME: identity-api
      SERVICE_ADDRESS: identity-api
      SERVICE_PORT: "8080"
      CONSUL_HTTP_ADDR: http://consul:8500
      SEQ_URL: http://seq:5341
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin123!}
      ConnectionStrings__IdentityDb: "Server=sqlserver,1433;Database=QualifyAI_IdentityDb;User Id=sa;Password=${SQL_SA_PASSWORD:-QualifyAI_SQL_ChangeMe123!};TrustServerCertificate=True;Encrypt=False"
      Services__TenantManagement: http://business-api:8080/internal
      Identity__Issuer: http://identity-api:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-qualifyai}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-QualifyAI_Rabbit_ChangeMe!}
    ports:
      - "8081:8080"
    networks: [qualifyai-infra]
    depends_on:
      - business-api
    restart: unless-stopped

  automation-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        PROJECT: src/Services/Automation/QualifyAI.Automation.Api/QualifyAI.Automation.Api.csproj
        DLL: QualifyAI.Automation.Api.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SERVICE_NAME: automation-api
      SERVICE_ADDRESS: automation-api
      SERVICE_PORT: "8080"
      CONSUL_HTTP_ADDR: http://consul:8500
      SEQ_URL: http://seq:5341
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-qualifyai}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-QualifyAI_Rabbit_ChangeMe!}
      ConnectionStrings__AutomationDb: "Server=sqlserver,1433;Database=QualifyAI_AutomationDb;User Id=sa;Password=${SQL_SA_PASSWORD:-QualifyAI_SQL_ChangeMe123!};TrustServerCertificate=True;Encrypt=False"
    networks: [qualifyai-infra]
    restart: unless-stopped

  notifications-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        PROJECT: src/Services/Notifications/QualifyAI.Notifications.Api/QualifyAI.Notifications.Api.csproj
        DLL: QualifyAI.Notifications.Api.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SERVICE_NAME: notifications-api
      SERVICE_ADDRESS: notifications-api
      SERVICE_PORT: "8080"
      CONSUL_HTTP_ADDR: http://consul:8500
      SEQ_URL: http://seq:5341
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-qualifyai}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-QualifyAI_Rabbit_ChangeMe!}
      ConnectionStrings__NotificationsDb: "Server=sqlserver,1433;Database=QualifyAI_NotificationsDb;User Id=sa;Password=${SQL_SA_PASSWORD:-QualifyAI_SQL_ChangeMe123!};TrustServerCertificate=True;Encrypt=False"
    networks: [qualifyai-infra]
    restart: unless-stopped

  knowledge-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        PROJECT: src/Services/Knowledge/QualifyAI.Knowledge.Api/QualifyAI.Knowledge.Api.csproj
        DLL: QualifyAI.Knowledge.Api.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SERVICE_NAME: knowledge-api
      SERVICE_ADDRESS: knowledge-api
      SERVICE_PORT: "8080"
      CONSUL_HTTP_ADDR: http://consul:8500
      SEQ_URL: http://seq:5341
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-qualifyai}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-QualifyAI_Rabbit_ChangeMe!}
      ConnectionStrings__KnowledgeDb: "Server=sqlserver,1433;Database=QualifyAI_KnowledgeDb;User Id=sa;Password=${SQL_SA_PASSWORD:-QualifyAI_SQL_ChangeMe123!};TrustServerCertificate=True;Encrypt=False"
      Mongo__ConnectionString: "mongodb://${MONGO_ROOT_USER:-qualifyai}:${MONGO_ROOT_PASSWORD:-QualifyAI_Mongo_ChangeMe!}@mongodb:27017/?authSource=admin"
    networks: [qualifyai-infra]
    restart: unless-stopped

  aiorchestration-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        PROJECT: src/Services/AIOrchestration/QualifyAI.AIOrchestration.Api/QualifyAI.AIOrchestration.Api.csproj
        DLL: QualifyAI.AIOrchestration.Api.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SERVICE_NAME: aiorchestration-api
      SERVICE_ADDRESS: aiorchestration-api
      SERVICE_PORT: "8080"
      CONSUL_HTTP_ADDR: http://consul:8500
      SEQ_URL: http://seq:5341
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-qualifyai}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-QualifyAI_Rabbit_ChangeMe!}
      ConnectionStrings__AIOrchestrationDb: "Server=sqlserver,1433;Database=QualifyAI_AIOrchestrationDb;User Id=sa;Password=${SQL_SA_PASSWORD:-QualifyAI_SQL_ChangeMe123!};TrustServerCertificate=True;Encrypt=False"
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
    networks: [qualifyai-infra]
    restart: unless-stopped

  integrations-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        PROJECT: src/Services/Integrations/QualifyAI.Integrations.Api/QualifyAI.Integrations.Api.csproj
        DLL: QualifyAI.Integrations.Api.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SERVICE_NAME: integrations-api
      SERVICE_ADDRESS: integrations-api
      SERVICE_PORT: "8080"
      CONSUL_HTTP_ADDR: http://consul:8500
      SEQ_URL: http://seq:5341
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-qualifyai}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-QualifyAI_Rabbit_ChangeMe!}
      ConnectionStrings__IntegrationsDb: "Server=sqlserver,1433;Database=QualifyAI_IntegrationsDb;User Id=sa;Password=${SQL_SA_PASSWORD:-QualifyAI_SQL_ChangeMe123!};TrustServerCertificate=True;Encrypt=False"
    networks: [qualifyai-infra]
    restart: unless-stopped

  admin-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    ports:
      - "8088:80"
    networks: [qualifyai-infra]
    depends_on:
      - business-api
      - identity-api
    restart: unless-stopped

networks:
  qualifyai-infra:
    external: true
    name: qualifyai-infra
