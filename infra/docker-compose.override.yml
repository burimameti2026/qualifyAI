name: qualifyai-infra

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: qualifyai-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:-QualifyAI_SQL_ChangeMe123!}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - qualifyai-infra
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQL_SA_PASSWORD:-QualifyAI_SQL_ChangeMe123!}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    container_name: qualifyai-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-qualifyai}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-QualifyAI_Mongo_ChangeMe!}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - qualifyai-infra
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\" -u ${MONGO_ROOT_USER:-qualifyai} -p '${MONGO_ROOT_PASSWORD:-QualifyAI_Mongo_ChangeMe!}' --authenticationDatabase admin | grep 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

networks:
  qualifyai-infra:
    external: true
    name: qualifyai-infra

volumes:
  sqlserver-data:
  mongodb-data:
