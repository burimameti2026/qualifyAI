name: qualifyai-infra
services:
  consul:
    image: hashicorp/consul:1.20
    container_name: qualifyai-consul
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    ports:
    - 8500:8500
    - 8600:8600/udp
    volumes:
    - consul-data:/consul/data
    networks:
    - qualifyai-infra
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4-management
    container_name: qualifyai-rabbitmq
    hostname: rabbitmq
    ports:
    - 5672:5672
    - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-qualifyai}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-QualifyAI_Rabbit_ChangeMe!}
    volumes:
    - rabbitmq-data:/var/lib/rabbitmq
    networks:
    - qualifyai-infra
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    container_name: qualifyai-redis
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --requirepass
    - ${REDIS_PASSWORD:-QualifyAI_Redis_ChangeMe!}
    ports:
    - 6379:6379
    volumes:
    - redis-data:/data
    networks:
    - qualifyai-infra
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a ${REDIS_PASSWORD:-QualifyAI_Redis_ChangeMe!} ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  seq:
    image: datalust/seq:2025.2
    container_name: qualifyai-seq
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:-QualifyAI_Seq_ChangeMe!}
    ports:
    - 5341:80
    - 5342:5341
    volumes:
    - seq-data:/data
    networks:
    - qualifyai-infra
    restart: unless-stopped
  portainer:
    image: portainer/portainer-ce:2.27.9
    container_name: qualifyai-portainer
    ports:
    - 9443:9443
    - 9000:9000
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - portainer-data:/data
    networks:
    - qualifyai-infra
    restart: unless-stopped
networks:
  qualifyai-infra:
    external: true
    name: qualifyai-infra
volumes:
  consul-data: null
  rabbitmq-data: null
  redis-data: null
  seq-data: null
  portainer-data: null
