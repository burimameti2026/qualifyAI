name: leadsai

x-api-environment: &api-environment
  ASPNETCORE_URLS: http://+:8080
  ASPNETCORE_ENVIRONMENT: Development
  SEQ_URL: http://seq:5341
  RabbitMq__Host: rabbitmq
  RabbitMq__Username: ${RABBITMQ_USER:-leadsai}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:-LeadsAI_Rabbit_ChangeMe!}

services:
  mongodb:
    image: mongo:8.0
    container_name: leadsai-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-leadsai}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-LeadsAI_Mongo_ChangeMe!}
    volumes: [mongodb-data:/data/db]
    networks: [leadsai]
    healthcheck:
      test: [CMD-SHELL, "mongosh --quiet --eval \"db.adminCommand('ping').ok\" -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: leadsai-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-leadsai}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-LeadsAI_Rabbit_ChangeMe!}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    networks: [leadsai]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: leadsai-redis
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD:-LeadsAI_Redis_ChangeMe!}"]
    volumes: [redis-data:/data]
    networks: [leadsai]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-LeadsAI_Redis_ChangeMe!}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  seq:
    image: datalust/seq:2025.2
    container_name: leadsai-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:-LeadsAI_Seq_ChangeMe!}
    volumes: [seq-data:/data]
    networks: [leadsai]
    restart: unless-stopped

  identity-api:
    container_name: leadsai-identity-api
    build:
      context: .
      dockerfile: src/Identity/LeadsAI.Identity.Api/Dockerfile
    environment:
      <<: *api-environment
      SERVICE_NAME: identity-api
      ConnectionStrings__IdentityDb: "Server=${DB_SERVER:?Set DB_SERVER in .env};Database=LeadsAI_IdentityDb;User Id=${DB_USER:?Set DB_USER in .env};Password=${DB_PASSWORD:?Set DB_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      Identity__Issuer: http://identity-api:8080
      Identity__Audience: leadsai-api
      IdentityBootstrap__Enabled: "true"
      IdentityBootstrap__Tenant__Id: ${FINDLEADSAI_TENANT_ID:-2f0c6e75-4df1-4bd5-bb49-6ef8ea0e3f1a}
      IdentityBootstrap__Tenant__Slug: ${FINDLEADSAI_TENANT_SLUG:-findleadsai}
      IdentityBootstrap__Tenant__Name: ${FINDLEADSAI_TENANT_NAME:-FindLeadsAI Master}
      IdentityBootstrap__Tenant__ContactEmail: ${FINDLEADSAI_CONTACT_EMAIL:-admin@findleadsai.local}
      IdentityBootstrap__License__Plan: ${FINDLEADSAI_LICENSE_PLAN:-Enterprise}
      IdentityBootstrap__Admin__Email: ${FINDLEADSAI_ADMIN_EMAIL:-admin@findleadsai.local}
      IdentityBootstrap__Admin__FirstName: ${FINDLEADSAI_ADMIN_FIRST_NAME:-Master}
      IdentityBootstrap__Admin__LastName: ${FINDLEADSAI_ADMIN_LAST_NAME:-Admin}
      IdentityBootstrap__Admin__Password: ${FINDLEADSAI_ADMIN_PASSWORD:-Admin123!ChangeMe}
      IdentityBootstrap__Admin__ResetPassword: ${FINDLEADSAI_ADMIN_RESET_PASSWORD:-true}
      Services__TenantManagement: http://platform-api:8080/internal
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:-LeadsAI_Redis_ChangeMe!},abortConnect=false"
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [leadsai]
    restart: unless-stopped

  platform-api:
    container_name: leadsai-platform-api
    build:
      context: .
      dockerfile: src/Platform/Presentation/LeadsAI.Api/Dockerfile
    environment:
      <<: *api-environment
      SERVICE_NAME: platform-api
      ConnectionStrings__DefaultConnection: "Server=${DB_SERVER:?Set DB_SERVER in .env};Database=LeadsAI_Business;User Id=${DB_USER:?Set DB_USER in .env};Password=${DB_PASSWORD:?Set DB_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      ConnectionStrings__AutomationDb: "Server=${DB_SERVER:?Set DB_SERVER in .env};Database=LeadsAI_AutomationDb;User Id=${DB_USER:?Set DB_USER in .env};Password=${DB_PASSWORD:?Set DB_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      ConnectionStrings__NotificationsDb: "Server=${DB_SERVER:?Set DB_SERVER in .env};Database=LeadsAI_NotificationsDb;User Id=${DB_USER:?Set DB_USER in .env};Password=${DB_PASSWORD:?Set DB_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      ConnectionStrings__KnowledgeDb: "Server=${DB_SERVER:?Set DB_SERVER in .env};Database=LeadsAI_KnowledgeDb;User Id=${DB_USER:?Set DB_USER in .env};Password=${DB_PASSWORD:?Set DB_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      ConnectionStrings__AIOrchestrationDb: "Server=${DB_SERVER:?Set DB_SERVER in .env};Database=LeadsAI_AIOrchestrationDb;User Id=${DB_USER:?Set DB_USER in .env};Password=${DB_PASSWORD:?Set DB_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      ConnectionStrings__IntegrationsDb: "Server=${DB_SERVER:?Set DB_SERVER in .env};Database=LeadsAI_IntegrationsDb;User Id=${DB_USER:?Set DB_USER in .env};Password=${DB_PASSWORD:?Set DB_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      TenantBootstrap__FindLeadsAI__TenantId: ${FINDLEADSAI_TENANT_ID:-2f0c6e75-4df1-4bd5-bb49-6ef8ea0e3f1a}
      DevelopmentSeed__Enabled: "true"
      DevelopmentSeed__TenantId: ${FINDLEADSAI_TENANT_ID:-2f0c6e75-4df1-4bd5-bb49-6ef8ea0e3f1a}
      TenantDatabases__findleadsai: FindLeadsAIPromotions
      Identity__Authority: http://identity-api:8080
      Identity__Audience: leadsai-api
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:-LeadsAI_Redis_ChangeMe!},abortConnect=false"
      Mongo__ConnectionString: "mongodb://${MONGO_ROOT_USER:-leadsai}:${MONGO_ROOT_PASSWORD:-LeadsAI_Mongo_ChangeMe!}@mongodb:27017/?authSource=admin"
      Mongo__Database: LeadsAI_Knowledge
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      ProspectDiscovery__SerpApi__ApiKey: ${SERPAPI_API_KEY:-}
      ProspectDiscovery__SerpApi__MonthlyLimitPath: ${SERPAPI_LIMIT:-}
      RevenueAutomation__Enabled: "true"
      RevenueAutomation__IntervalSeconds: "300"
      Email__Provider: ${EMAIL_PROVIDER:-disabled}
      Email__DailySendLimit: ${OUTREACH_DAILY_SEND_LIMIT:-10}
      Email__Brevo__ApiKey: ${BREVO_API_KEY:-}
      Email__Brevo__WebhookToken: ${BREVO_WEBHOOK_TOKEN:-}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__UseTls: ${SMTP_USE_TLS:-true}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__SendGrid__ApiKey: ${SENDGRID_API_KEY:-}
      Email__SendGrid__WebhookToken: ${SENDGRID_WEBHOOK_TOKEN:-}
      Email__SendGrid__InboundWebhookToken: ${SENDGRID_INBOUND_WEBHOOK_TOKEN:-}
      Landing__DemoRequestRecipients: ${DEMO_REQUEST_RECIPIENTS:-}
      Landing__DemoRequestRecipient: ${DEMO_REQUEST_RECIPIENT:-}
      Landing__DemoRequestFromEmail: ${DEMO_REQUEST_FROM_EMAIL:-}
      Landing__DemoRequestFromName: ${DEMO_REQUEST_FROM_NAME:-FindLeadsAI Product Team}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    networks: [leadsai]
    restart: unless-stopped

  api-gateway:
    container_name: leadsai-api-gateway
    build:
      context: .
      dockerfile: src/ApiGateway/LeadsAI.ApiGateway/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      SERVICE_NAME: api-gateway
      SEQ_URL: http://seq:5341
    depends_on:
      identity-api:
        condition: service_started
      platform-api:
        condition: service_started
    networks: [leadsai]
    restart: unless-stopped

  portainer:
    profiles: [tools]
    image: portainer/portainer-ce:2.27.9
    container_name: leadsai-portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks: [leadsai]
    restart: unless-stopped

networks:
  leadsai:
    name: leadsai-network

volumes:
  mongodb-data:
  rabbitmq-data:
  redis-data:
  seq-data:
  portainer-data:
