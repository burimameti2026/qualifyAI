name: Complete QualifyAI to LeadsAI rename
on:
  workflow_dispatch:
  push:
    branches: [renova]
permissions:
  contents: write
jobs:
  rename:
    if: github.event.head_commit.message != 'Rename QualifyAI to LeadsAI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename project paths
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -depth -name '*QualifyAI*' -print0 | while IFS= read -r -d '' p; do
            np="${p//QualifyAI/LeadsAI}"
            if [ "$p" != "$np" ]; then
              git mv "$p" "$np"
            fi
          done
      - name: Rename project references and namespaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          skip = {'.git', '.github'}
          replacements = {'QualifyAI': 'LeadsAI', 'QUALIFYAI': 'LEADSAI'}
          for p in root.rglob('*'):
              if not p.is_file() or any(part in skip for part in p.parts):
                  continue
              try:
                  data = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new = data
              for old, value in replacements.items():
                  new = new.replace(old, value)
              if new != data:
                  p.write_text(new, encoding='utf-8', newline='')
          PY
      - name: Verify no old project name remains
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -e 'QualifyAI' -e 'QUALIFYAI' -- ':!.github/workflows/complete-rename.yml'; then
            echo 'ERROR: old QualifyAI references remain.'
            exit 1
          fi
          if find . -not -path './.git/*' -name '*QualifyAI*' -print -quit | grep -q .; then
            echo 'ERROR: old QualifyAI paths remain.'
            exit 1
          fi
      - name: Commit completed rename
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/complete-rename.yml
          git add -A
          git commit -m "Rename QualifyAI to LeadsAI"
          git push origin HEAD:renova
