name: Complete QualifyAI to LeadsAI rename
on:
  workflow_dispatch:
  push:
    branches: [renova]
permissions:
  contents: write
jobs:
  rename:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Rename QualifyAI to LeadsAI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: renova
          fetch-depth: 0
      - name: Rename every tracked project path
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git ls-files -z | while IFS= read -r -d '' p; do
            case "$p" in
              *QualifyAI*)
                np="${p//QualifyAI/LeadsAI}"
                mkdir -p "$(dirname "$np")"
                git mv -- "$p" "$np"
                ;;
            esac
          done
      - name: Replace all project references and namespaces
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in
              *.cs|*.csproj|*.sln|*.slnx|*.props|*.targets|*.json|*.xml|*.yml|*.yaml|*.md|*.txt|*.ps1|*.sh|*.cmd|*.bat|*.dockerfile|Dockerfile|*.config|*.http|*.editorconfig|*.gitignore|*.gitattributes|*.env|*.example)
                python3 - "$file" <<'PY'
import pathlib, sys
p = pathlib.Path(sys.argv[1])
try:
    s = p.read_text(encoding='utf-8')
except (UnicodeDecodeError, OSError):
    raise SystemExit(0)
for old, new in (
    ('QualifyAI', 'LeadsAI'),
    ('QUALIFYAI', 'LEADSAI'),
    ('qualifyAI', 'leadsAI'),
    ('qualifyai', 'leadsai'),
):
    s = s.replace(old, new)
p.write_text(s, encoding='utf-8', newline='')
PY
                ;;
            esac
          done < <(git ls-files -z)
      - name: Verify complete rename
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/complete-rename.yml .github/workflows/rename-to-leadsai.yml 2>/dev/null || true
          echo 'Checking old-name paths...'
          if git ls-files | grep -E 'QualifyAI|QUALIFYAI|qualifyAI|qualifyai'; then
            echo 'ERROR: old name remains in tracked paths.'
            exit 1
          fi
          echo 'Checking old-name content...'
          if git grep -n -I -E 'QualifyAI|QUALIFYAI|qualifyAI|qualifyai' -- . ':!.git' >/dev/null; then
            git grep -n -I -E 'QualifyAI|QUALIFYAI|qualifyAI|qualifyai' -- . ':!.git' || true
            echo 'ERROR: old name remains in tracked content.'
            exit 1
          fi
          test -f LeadsAI.sln
          echo 'QualifyAI -> LeadsAI rename verified.'
      - name: Commit completed rename
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Rename QualifyAI to LeadsAI"
          git push origin HEAD:renova
