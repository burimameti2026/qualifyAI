name: Complete QualifyAI to LeadsAI rename
on:
  workflow_dispatch:
  push:
    branches: [renova]
permissions:
  contents: write
jobs:
  rename:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Rename QualifyAI to LeadsAI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: renova
          fetch-depth: 0
      - name: Rename all tracked paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files = [Path(p.decode()) for p in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if p]
          mappings = [(p, Path(str(p).replace('QualifyAI','LeadsAI'))) for p in files if 'QualifyAI' in str(p)]
          for src, dst in mappings:
              if dst.exists():
                  raise SystemExit(f'Destination already exists: {dst}')
          for src, dst in mappings:
              dst.parent.mkdir(parents=True, exist_ok=True)
              src.rename(dst)
          print(f'Renamed {len(mappings)} tracked paths')
          PY
      - name: Replace all references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = (('QualifyAI','LeadsAI'),('QUALIFYAI','LEADSAI'),('qualifyAI','leadsAI'),('qualifyai','leadsai'))
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try:
                  data = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new = data
              for old, value in replacements:
                  new = new.replace(old, value)
              if new != data:
                  p.write_text(new, encoding='utf-8', newline='')
          PY
      - name: Verify rename
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/complete-rename.yml .github/workflows/rename-to-leadsai.yml
          git add -A
          if find . -not -path './.git/*' \( -name '*QualifyAI*' -o -name '*QUALIFYAI*' -o -name '*qualifyAI*' -o -name '*qualifyai*' \) -print -quit | grep -q .; then
            echo 'ERROR: old-name filesystem paths remain'
            exit 1
          fi
          if git grep -n -I -E 'QualifyAI|QUALIFYAI|qualifyAI|qualifyai' --cached -- . ':!.git' >/dev/null; then
            git grep -n -I -E 'QualifyAI|QUALIFYAI|qualifyAI|qualifyai' --cached -- . ':!.git' || true
            echo 'ERROR: old-name content remains'
            exit 1
          fi
          test -f LeadsAI.sln
          echo 'QualifyAI -> LeadsAI verification passed.'
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rename QualifyAI to LeadsAI"
          git push origin HEAD:renova
