# Temporary one-time migration workflow: QualifyAI -> LeadsAI
name: Rename QualifyAI to LeadsAI
on:
  push:
    branches: [renova]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Rename QualifyAI to LeadsAI')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: renova
          fetch-depth: 0
      - name: Rename paths and references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, uuid
          files = [Path(p.decode()) for p in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if p]
          mappings = [(p, Path(str(p).replace('QualifyAI','LeadsAI'))) for p in files if 'QualifyAI' in str(p)]
          tmp = Path(f'.rename-tmp-{uuid.uuid4().hex}')
          tmp.mkdir()
          try:
              staged = []
              for src, dst in mappings:
                  t = tmp / src
                  t.parent.mkdir(parents=True, exist_ok=True)
                  src.rename(t)
                  staged.append((t, dst))
              for t, dst in staged:
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  t.rename(dst)
          finally:
              if tmp.exists():
                  import shutil
                  shutil.rmtree(tmp, ignore_errors=True)
          print(f'Renamed {len(mappings)} tracked paths')
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try:
                  data = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new = data
              for old, value in (('QualifyAI','LeadsAI'),('QUALIFYAI','LEADSAI'),('qualifyAI','leadsAI'),('qualifyai','leadsai')):
                  new = new.replace(old, value)
              if new != data:
                  p.write_text(new, encoding='utf-8', newline='')
          PY
          find . -type d -name '*QualifyAI*' -prune -exec rm -rf {} +
          find . -type d -name '*QUALIFYAI*' -prune -exec rm -rf {} +
          find . -type d -name '*qualifyAI*' -prune -exec rm -rf {} +
          find . -type d -name '*qualifyai*' -prune -exec rm -rf {} +
          rm -f .github/workflows/complete-rename.yml .github/workflows/rename-to-leadsai.yml
          git add -A
          if git ls-files | grep -E 'QualifyAI|QUALIFYAI|qualifyAI|qualifyai' >/dev/null; then
            echo 'ERROR: old-name tracked paths remain'
            git ls-files | grep -E 'QualifyAI|QUALIFYAI|qualifyAI|qualifyai' || true
            exit 1
          fi
          if git grep -n -I -E 'QualifyAI|QUALIFYAI|qualifyAI|qualifyai' --cached -- . ':!.git' >/dev/null; then
            git grep -n -I -E 'QualifyAI|QUALIFYAI|qualifyAI|qualifyai' --cached -- . ':!.git' || true
            echo 'ERROR: old-name content remains'
            exit 1
          fi
          test -f LeadsAI.sln
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rename QualifyAI to LeadsAI'
          git push origin HEAD:renova
