name: QualifyAI CI

on:
  push:
    branches:
      - feature/fixes
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master

concurrency:
  group: qualifyai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore QualifyAI.sln --disable-parallel

      - name: Build
        run: dotnet build QualifyAI.sln --configuration Release --no-restore --warnaserror

  admin-ui:
    name: Admin UI build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: admin/qualifyai-admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/qualifyai-admin/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
