name: RaiseLead CI

on:
  push:
    branches: [renameproject, feature/fixes, feature/golden-pipeline, dev, master]
  pull_request:
    branches: [dev, master]

concurrency:
  group: raiselead-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 9.0.x }
      - name: Architecture guard (advisory)
        continue-on-error: true
        shell: pwsh
        run: ./scripts/check-architecture.ps1
      - name: Restore
        run: dotnet restore RaiseLead.sln --disable-parallel
      - name: Build
        run: dotnet build RaiseLead.sln --configuration Release --no-restore --warnaserror
      - name: Billing hardening tests
        run: dotnet test tests/QualifyAI.BillingHardening.Tests/QualifyAI.BillingHardening.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=billing-hardening.trx"
  admin-ui:
    name: Admin UI build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: admin-ui
        shell: bash
        run: |
          if [ -f "admin/qualifyai-admin/package-lock.json" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.admin-ui.outputs.exists == 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: admin/qualifyai-admin/package-lock.json }
      - if: steps.admin-ui.outputs.exists == 'true'
        working-directory: admin/qualifyai-admin
        run: npm ci --no-audit --no-fund
      - if: steps.admin-ui.outputs.exists == 'true'
        working-directory: admin/qualifyai-admin
        run: npm run build
