services:
  sqlserver:
    ports: ["1433:1433"]
  mongodb:
    ports: ["27017:27017"]
  rabbitmq:
    ports: ["5672:5672", "15672:15672"]
  redis:
    ports: ["6379:6379"]
  consul:
    ports: ["8500:8500", "8600:8600/udp"]
  seq:
    ports: ["5341:80", "5342:5341"]

  business-api:
    environment: { ASPNETCORE_ENVIRONMENT: Development }
    ports: ["8080:8080"]
  identity-api:
    environment: { ASPNETCORE_ENVIRONMENT: Development }
    ports: ["8081:8080"]
  automation-api:
    environment: { ASPNETCORE_ENVIRONMENT: Development }
    ports: ["8082:8080"]
  notifications-api:
    environment: { ASPNETCORE_ENVIRONMENT: Development }
    ports: ["8083:8080"]
  knowledge-api:
    environment: { ASPNETCORE_ENVIRONMENT: Development }
    ports: ["8084:8080"]
  aiorchestration-api:
    environment: { ASPNETCORE_ENVIRONMENT: Development }
    ports: ["8085:8080"]
  integrations-api:
    environment: { ASPNETCORE_ENVIRONMENT: Development }
    ports: ["8086:8080"]
