events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream business_api { server business-api:8080; }
  upstream identity_api { server identity-api:8080; }
  upstream automation_api { server automation-api:8080; }
  upstream notifications_api { server notifications-api:8080; }
  upstream knowledge_api { server knowledge-api:8080; }
  upstream ai_api { server aiorchestration-api:8080; }
  upstream integrations_api { server integrations-api:8080; }

  server {
    listen 8080;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;

    location /connect/ { proxy_pass http://identity_api/connect/; }
    location /identity/ {
      rewrite ^/identity/(.*)$ /$1 break;
      proxy_pass http://identity_api;
    }
    location /api/ { proxy_pass http://business_api/api/; }
    location /hubs/ {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://business_api/hubs/;
    }

    location /services/automation/ {
      rewrite ^/services/automation/(.*)$ /$1 break;
      proxy_pass http://automation_api;
    }
    location /services/notifications/ {
      rewrite ^/services/notifications/(.*)$ /$1 break;
      proxy_pass http://notifications_api;
    }
    location /services/knowledge/ {
      rewrite ^/services/knowledge/(.*)$ /$1 break;
      proxy_pass http://knowledge_api;
    }
    location /services/ai/ {
      rewrite ^/services/ai/(.*)$ /$1 break;
      proxy_pass http://ai_api;
    }
    location /services/integrations/ {
      rewrite ^/services/integrations/(.*)$ /$1 break;
      proxy_pass http://integrations_api;
    }

    location = /health { proxy_pass http://business_api/health; }
  }
}
